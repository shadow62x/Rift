<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Granny — Auto Play</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0c0d14;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #game-wrap {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
  }
  #game-frame {
    width: 100%; height: 100%;
    border: 0;
    display: block;
    background: #000;
  }
  #loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: #0c0d14;
    color: #fff;
    z-index: 10;
    transition: opacity .4s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,.2);
    border-top-color: #FA4A35;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { font-size: 15px; opacity: .8; }
</style>
</head>
<body>

<div id="game-wrap">
  <!-- Auto-loads the real game instantly, no Play Now click needed -->
  <iframe
    id="game-frame"
    src="https://game.azgame.io/granny-horror/"
    width="100%"
    height="100%"
    frameborder="0"
    scrolling="no"
    allowfullscreen="true"
    allow="autoplay; fullscreen; gamepad; pointer-lock; cross-origin-isolated"
  ></iframe>
</div>

<div id="loader">
  <div class="spinner"></div>
  <p>Loading Granny…</p>
</div>

<script>
  // Hide loader once the game iframe reports load (plus a small fallback timeout)
  var frame = document.getElementById('game-frame');
  var loader = document.getElementById('loader');

  function hideLoader() {
    loader.classList.add('hidden');
    try { frame.focus(); } catch (e) {}
  }

  frame.addEventListener('load', function () {
    // give the game a beat to paint before removing loader
    setTimeout(hideLoader, 800);
  });

  // Fallback: never trap user on loader if load event is blocked
  setTimeout(hideLoader, 8000);
</script>

</body>
</html>
