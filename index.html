<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b1a">
  <title>UserCreation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-a: 8, 10, 24;
      --bg-b: 18, 21, 48;
      --tone-a: 67, 86, 255;
      --tone-b: 186, 78, 241;
      --tone-c: 36, 202, 222;
      --tone-d: 224, 67, 149;
      --tone-e: 108, 152, 255;
      --interactive: 150, 124, 255;
      --text: 255, 255, 255;
      --muted: 190, 193, 216;
      --line: 255, 255, 255;
      --danger: 255, 109, 120;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; height: 100%; min-width: 320px; overflow: hidden; }
    html { color-scheme: dark; }

    body {
      font-family: Inter, system-ui, sans-serif;
      color: rgb(var(--text));
      background: rgb(var(--bg-a));
    }

    button, input { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .gradient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 120%, rgba(var(--tone-c), .12), transparent 48%),
        radial-gradient(ellipse at 50% -20%, rgba(var(--tone-b), .13), transparent 50%),
        linear-gradient(135deg, rgb(var(--bg-a)), rgb(var(--bg-b)));
      background-size: 145% 145%, 145% 145%, 165% 165%;
      background-position: 48% 52%, 52% 48%, 50% 50%;
      animation: ambient-flow 14s ease-in-out infinite alternate;
      transition: background 1.2s ease;
    }

    .gradient-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .2;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 74px 74px;
      mask-image: linear-gradient(to bottom, #000, transparent 86%);
    }

    .gradient-bg::after {
      content: "";
      position: absolute;
      inset: -5%;
      z-index: 1;
      opacity: .25;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='monoNoise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='2' seed='17' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23monoNoise)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
      background-blend-mode: multiply;
      mix-blend-mode: multiply;
      animation: noise-drift .7s steps(2, end) infinite;
    }

    .rainbow-wash {
      position: absolute;
      inset: -58%;
      opacity: .78;
      background: var(--ambient-gradient, conic-gradient(from 0deg at 50% 50%, #ff3864 0deg, #ff9f1c 48deg, #ffe66d 92deg, #3ee58b 145deg, #20d7f2 196deg, #4f7cff 244deg, #a855f7 300deg, #ff4dba 338deg, #ff3864 360deg));
      filter: blur(92px) saturate(138%);
      mix-blend-mode: screen;
      transform-origin: center;
      will-change: transform, filter, opacity;
      animation: rainbow-spin 24s linear infinite, rainbow-breathe 7s ease-in-out infinite alternate;
      transition: opacity .8s var(--ease);
    }

    .rainbow-wash::after {
      content: "";
      position: absolute;
      inset: 24%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.34), transparent 64%);
      filter: blur(30px);
    }

    body[data-ambient="classic"] .rainbow-wash { opacity: 0; }
    body[data-ambient="gradient"] .rainbow-wash { inset: -12%; opacity: .9; mix-blend-mode: normal; filter: blur(48px) saturate(118%); background-size: 150% 150%; animation: gradient-layer-flow 12s ease-in-out infinite alternate; }
    body[data-ambient="gradient"] .rainbow-wash::after { opacity: .18; }
    body[data-ambient="rainbow"] .orb { opacity: .72; }
    body[data-ambient="gradient"] .orb { opacity: .12; }
    .gradient-crossfade-old { position: absolute; z-index: 0; pointer-events: none; will-change: opacity; transition: opacity .9s ease; }

    .aurora {
      position: absolute;
      inset: -25%;
      filter: blur(66px) saturate(120%);
      opacity: .9;
      transform: translateZ(0);
    }

    .orb {
      position: absolute;
      width: 55vw;
      height: 55vw;
      min-width: 420px;
      min-height: 420px;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
      transition: background 1s ease;
    }

    .orb-a { top: 4%; left: 25%; background: radial-gradient(circle, rgba(var(--tone-a), .8), transparent 64%); animation: orbit-a 30s ease-in-out infinite alternate; }
    .orb-b { top: 12%; right: 2%; background: radial-gradient(circle, rgba(var(--tone-b), .72), transparent 64%); animation: orbit-b 38s ease-in-out infinite alternate; }
    .orb-c { right: 16%; bottom: -22%; background: radial-gradient(circle, rgba(var(--tone-d), .63), transparent 66%); animation: orbit-c 34s ease-in-out infinite alternate; }
    .orb-d { left: -17%; bottom: -15%; background: radial-gradient(circle, rgba(var(--tone-c), .67), transparent 65%); animation: orbit-d 42s ease-in-out infinite alternate; }
    .orb-e { top: 34%; left: 32%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(var(--tone-e), .42), transparent 62%); animation: orbit-e 48s ease-in-out infinite alternate; }

    .interactive {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 100%;
      height: 100%;
      opacity: .24;
      background: radial-gradient(circle at center, rgba(var(--interactive), .5), transparent 60%);
      mix-blend-mode: screen;
      transition: top .55s var(--ease), left .55s var(--ease), background 1s ease;
    }

    .logo {
      position: fixed;
      top: 31px;
      left: 32px;
      z-index: 5;
      color: rgba(var(--text), .84);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .01em;
    }

    .step-count {
      position: fixed;
      top: 34px;
      right: 32px;
      z-index: 5;
      color: rgba(var(--muted), .58);
      font-size: 11px;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .page {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 90px 72px 84px;
      text-align: center;
      opacity: 1;
      transition: transform .6s var(--ease), opacity .6s var(--ease);
    }

    .page.hidden { transform: translateX(-42px); opacity: 0; pointer-events: none; }
    .page.next { transform: translateX(42px); opacity: 0; pointer-events: none; }
    .page-content { width: min(720px, 100%); }

    .page.entering .main-text { animation: entrance-title .9s var(--ease) both; }
    .page.entering .sub-text { animation: entrance-subtitle .95s var(--ease) .07s both; }
    .page.entering .palette { animation: entrance-control 1s var(--ease) .12s both; }
    .page.entering .input-container { animation: entrance-control 1s var(--ease) .16s both; }
    .page.entering .snippet { animation: entrance-control 1s var(--ease) .14s both; }
    .page.entering .snippet-note { animation: entrance-subtitle .9s var(--ease) .25s both; }

    .eyebrow {
      margin-bottom: 17px;
      color: rgb(var(--interactive));
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .main-text {
      margin-bottom: 19px;
      font-size: clamp(44px, 5.7vw, 60px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1.04;
      text-wrap: balance;
      opacity: .94;
      transition: transform .7s var(--ease), opacity .7s var(--ease);
    }

    .page.hidden .main-text, .page.next .main-text { transform: translateY(10px); opacity: 0; }

    .sub-text {
      color: rgba(var(--muted), .78);
      font-size: 17px;
      line-height: 1.6;
      transition: transform .7s var(--ease) .05s, opacity .7s var(--ease) .05s;
    }

    .page.hidden .sub-text, .page.next .sub-text { transform: translateY(10px); opacity: 0; }

    .input-container {
      position: relative;
      width: min(340px, 100%);
      margin: 29px auto 0;
      text-align: left;
      transition: transform .7s var(--ease) .1s, opacity .7s var(--ease) .1s;
    }

    .input-container::after {
      content: "";
      position: absolute;
      top: 22px;
      left: 1px;
      width: 34%;
      height: 56px;
      border-radius: 22px;
      opacity: 0;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.26), transparent);
      filter: blur(2px);
      pointer-events: none;
      transform: translateX(-115%) skewX(-16deg);
    }

    .input-container:focus-within::after {
      animation: glass-sheen 1.15s var(--ease) both;
    }

    .page.hidden .input-container, .page.next .input-container { transform: translateY(10px); opacity: 0; }

    .input-label {
      display: block;
      margin-bottom: 9px;
      color: rgba(var(--muted), .6);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .user-input {
      width: 100%;
      height: 56px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 22px;
      outline: none;
      background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.045)) padding-box, linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.18) 52%, rgba(255,255,255,0) 100%) border-box;
      box-shadow: inset 0 1px rgba(255,255,255,.18), inset 0 -1px rgba(0,0,0,.14), 0 12px 30px rgba(0,0,0,.12);
      backdrop-filter: blur(18px) saturate(135%);
      caret-color: rgb(var(--interactive));
      transition: border-color .28s var(--ease), background .28s var(--ease), box-shadow .32s var(--ease), transform .28s var(--ease), color .28s ease, text-shadow .4s ease;
    }

    .user-input::placeholder { color: rgba(var(--muted), .46); }
    .user-input:hover { border-color: transparent; background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.06)) padding-box, linear-gradient(180deg, rgba(255,255,255,.36) 0%, rgba(255,255,255,.2) 52%, rgba(255,255,255,0) 100%) border-box; transform: translateY(-1px); }
    .user-input:focus { border-color: transparent; background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.07)) padding-box, linear-gradient(180deg, rgba(var(--interactive), .92) 0%, rgba(var(--interactive), .48) 52%, rgba(var(--interactive), 0) 100%) border-box; box-shadow: inset 0 1px rgba(255,255,255,.2), 0 0 0 4px rgba(var(--interactive), .14), 0 16px 34px rgba(0,0,0,.2); transform: translateY(-2px) scale(1.012); animation: focus-bloom .48s var(--ease); }
    .user-input.typing-active { color: rgba(var(--text), .98); text-shadow: 0 0 7px rgba(var(--interactive), .28); }
    .user-input.error { border-color: rgba(var(--danger), .78); animation: shake .35s ease; }


    .field-message { min-height: 17px; margin: 8px 0 0; color: rgb(var(--danger)); font-size: 11px; }

    .palette {
      display: flex;
      justify-content: center;
      gap: 11px;
      margin: 28px auto 0;
    }

    .palette-wrap { position: relative; width: max-content; max-width: 100%; margin: 0 auto; }

    .swatch {
      position: relative;
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      padding: 4px;
      border: 1px solid rgba(var(--line), .15);
      border-radius: 50%;
      background: rgba(255,255,255,.04);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .swatch::before { content: ""; width: 100%; height: 100%; border-radius: 50%; background: var(--swatch); animation: swatch-pulse 2.8s ease-in-out infinite alternate; }
    .swatch[data-color="rainbow"]::before {
      background: conic-gradient(#ff3864, #ffb21c, #ffe66d, #3ee58b, #20d7f2, #4f7cff, #a855f7, #ff4dba, #ff3864);
      animation: swatch-rainbow 5s linear infinite, swatch-pulse 2.8s ease-in-out infinite alternate;
    }
    .swatch[data-color="rainbow"]::after { filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
    .swatch:hover { transform: translateY(-2px); border-color: rgba(var(--line), .38); }
    .swatch[aria-pressed="true"] { border-color: rgb(var(--text)); box-shadow: 0 0 0 3px rgba(var(--interactive), .22); }
    .swatch[aria-pressed="true"]::after { content: ""; position: absolute; width: 8px; height: 4px; border-bottom: 2px solid #fff; border-left: 2px solid #fff; transform: rotate(-45deg); }

    .more-colors {
      position: relative;
      display: flex;
      width: 39px;
      height: 39px;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0;
      border: 1px solid rgba(var(--line), .15);
      border-radius: 50%;
      color: rgba(var(--text), .68);
      overflow: hidden;
      background: rgba(255,255,255,.04);
      cursor: pointer;
      transition: color .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .more-colors::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: conic-gradient(from 120deg, #ff3864, #ffb21c, #ffe66d, #3ee58b, #20d7f2, #4f7cff, #a855f7, #ff4dba, #ff3864); background-size: 180% 180%; animation: swatch-rainbow 6s linear infinite, more-colors-breathe 2.8s ease-in-out infinite alternate; }
    .more-colors span { position: relative; z-index: 1; width: 3px; height: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.6); }
    .more-colors:hover, .more-colors[aria-expanded="true"] { color: rgb(var(--text)); border-color: rgba(var(--line), .34); background: rgba(255,255,255,.09); }
    .more-colors[aria-pressed="true"] { border-color: rgb(var(--text)); box-shadow: 0 0 0 3px rgba(var(--interactive), .22); }

    .gradient-menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      z-index: 8;
      width: min(216px, calc(100vw - 40px));
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.065)) padding-box, linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.08)) border-box;
      box-shadow: inset 0 1px rgba(255,255,255,.16), 0 22px 60px rgba(0,0,0,.3);
      backdrop-filter: blur(28px) saturate(145%);
      transform: translateX(-50%);
      animation: menu-in .25s var(--ease) both;
    }
    .gradient-menu[hidden] { display: none; }
    .gradient-menu-title { display: none; }
    .gradient-grid { display: grid; grid-template-columns: repeat(4, 39px); justify-content: center; gap: 10px; }
    .gradient-option { position: relative; display: grid; width: 39px; height: 39px; place-items: center; padding: 4px; border: 1px solid rgba(var(--line), .15); border-radius: 50%; color: rgba(var(--text), .72); background: rgba(255,255,255,.04); cursor: pointer; opacity: 0; animation: gradient-option-in .38s var(--ease) both; transition: color .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .18s var(--ease); }
    .gradient-option:nth-child(1) { animation-delay: .04s; }
    .gradient-option:nth-child(2) { animation-delay: .08s; }
    .gradient-option:nth-child(3) { animation-delay: .12s; }
    .gradient-option:nth-child(4) { animation-delay: .16s; }
    .gradient-option:nth-child(5) { animation-delay: .2s; }
    .gradient-option:nth-child(6) { animation-delay: .24s; }
    .gradient-option:nth-child(7) { animation-delay: .28s; }
    .gradient-option:nth-child(8) { animation-delay: .32s; }
    .gradient-option:nth-child(9) { animation-delay: .36s; }
    .gradient-option:nth-child(10) { animation-delay: .4s; }
    .gradient-option:nth-child(11) { animation-delay: .44s; }
    .gradient-option:nth-child(12) { animation-delay: .48s; }
    .gradient-option:hover { color: rgb(var(--text)); border-color: rgba(var(--line), .38); background: rgba(255,255,255,.09); transform: scale(1.08); }
    .gradient-option:active { transform: scale(.94); }
    .gradient-option[aria-pressed="true"] { border-color: rgb(var(--text)); box-shadow: 0 0 0 3px rgba(var(--interactive), .22); }
    .gradient-option[aria-pressed="true"]::after { content: ""; position: absolute; z-index: 2; width: 8px; height: 4px; border-bottom: 2px solid #fff; border-left: 2px solid #fff; transform: translateY(-1px) rotate(-45deg); filter: drop-shadow(0 1px 2px rgba(0,0,0,.65)); }
    .gradient-preview { display: block; width: 100%; height: 100%; border: 1px solid rgba(255,255,255,.15); border-radius: 50%; background: var(--gradient); background-size: 220% 220%; box-shadow: inset 0 1px rgba(255,255,255,.18); animation: gradient-preview 4.8s ease-in-out infinite alternate; }
    .gradient-option[data-gradient="rainbow"] .gradient-preview { background-size: 100% 100%; animation: swatch-rainbow 6s linear infinite; }
    .gradient-label { display: none; }

    .navigation {
      position: fixed;
      top: 50%;
      z-index: 4;
      display: flex;
      width: 48px;
      height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.045)) padding-box, linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.18) 52%, rgba(255,255,255,0) 100%) border-box;
      box-shadow: inset 0 1px rgba(255,255,255,.18), inset 0 -1px rgba(0,0,0,.14), 0 12px 30px rgba(0,0,0,.12);
      backdrop-filter: blur(18px) saturate(135%);
      cursor: pointer;
      transform: translateY(-50%);
      transition: background .28s ease, border-color .28s ease, box-shadow .28s ease, transform .2s var(--ease);
    }

    .navigation:hover { border-color: transparent; background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.07)) padding-box, linear-gradient(180deg, rgba(255,255,255,.36) 0%, rgba(255,255,255,.2) 52%, rgba(255,255,255,0) 100%) border-box; box-shadow: inset 0 1px rgba(255,255,255,.2), 0 0 0 4px rgba(var(--interactive), .12), 0 16px 34px rgba(0,0,0,.2); transform: translateY(-50%) scale(1.04); }
    .navigation:active { transform: translateY(-50%) scale(.97); }
    .navigation svg { width: 23px; height: 23px; stroke-width: 2.2; }
    .chevron-right { right: 30px; }
    .chevron-left { left: 30px; display: none; }

    .page-indicator { position: fixed; bottom: 29px; left: 50%; z-index: 4; display: flex; gap: 8px; transform: translateX(-50%); }
    .dot { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: rgba(var(--text),.25); cursor: pointer; transition: transform .25s, background .25s; }
    .dot.active { background: rgba(var(--text),.9); transform: scale(1.25); }

    .snippet {
      position: relative;
      width: min(760px, 100%);
      margin: 30px auto 0;
      overflow: visible;
      isolation: isolate;
      border: 1px solid transparent;
      border-radius: 22px;
      text-align: left;
      background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.045)) padding-box, linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.18) 52%, rgba(255,255,255,0) 100%) border-box;
      box-shadow: inset 0 1px rgba(255,255,255,.18), inset 0 -1px rgba(0,0,0,.14), 0 12px 30px rgba(0,0,0,.12);
      backdrop-filter: blur(18px) saturate(135%);
      transition: transform .7s var(--ease) .1s, opacity .7s var(--ease) .1s;
    }

    .snippet::after {
      content: "";
      position: absolute;
      inset: -2px;
      z-index: 0;
      padding: 1px;
      border-radius: 24px;
      opacity: 0;
      background: linear-gradient(110deg, transparent 28%, rgba(255,255,255,.72) 48%, rgba(var(--interactive), .65) 53%, transparent 72%);
      background-size: 240% 100%;
      background-position: 150% 50%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      filter: blur(1px);
      pointer-events: none;
      transform: none;
    }

    .snippet::before {
      content: "";
      position: absolute;
      inset: -15px;
      z-index: -1;
      border-radius: 36px;
      opacity: 0;
      background: linear-gradient(110deg, transparent 18%, rgba(255,255,255,.5) 44%, rgba(var(--interactive), .72) 52%, rgba(var(--tone-c), .4) 60%, transparent 82%);
      background-size: 240% 100%;
      background-position: 150% 50%;
      filter: blur(14px) saturate(135%);
      pointer-events: none;
    }

    .snippet:focus-within::after { animation: border-sheen 1.6s var(--ease) .15s both; }
    .snippet.shine-entry::after { animation: border-sheen 1.6s var(--ease) .8s both; }
    .snippet:focus-within::before { animation: outer-sheen 1.6s var(--ease) .15s both; }
    .snippet.shine-entry::before { animation: outer-sheen 1.6s var(--ease) .8s both; }

    .page.hidden .snippet, .page.next .snippet { transform: translateY(10px); opacity: 0; }

    .copy-button { position: absolute; top: 13px; right: 18px; z-index: 2; display: grid; width: 40px; height: 40px; place-items: center; padding: 0; border: 0; border-radius: 11px; color: rgba(var(--text), .62); background: transparent; cursor: pointer; transition: transform .18s var(--ease), background-color .28s ease, color .28s ease, box-shadow .28s ease; }
    .copy-button:hover { color: rgb(var(--text)); background-color: rgba(255,255,255,.09); }
    .copy-button:active { background-color: rgba(255,255,255,.14); transform: translateY(1px) scale(.88); transition-duration: .08s; }
    .copy-button:focus-visible { outline: 2px solid rgba(var(--interactive), .9); outline-offset: 2px; }
    .copy-button.copied { color: #8cf0ba; background-color: transparent; box-shadow: none; animation: copy-pop .38s var(--ease); }
    .copy-icon { position: relative; display: grid; width: 18px; height: 18px; place-items: center; }

      sunset: gradients.sunset.palette,
      ocean: gradients.ocean.palette,
      aurora: gradients.aurora.palette,
      berry: gradients.berry.palette,
      fire: gradients.fire.palette,
      mint: gradients.mint.palette,
      candy: gradients.candy.palette,
      lavender: gradients.lavender.palette,
      tropical: gradients.tropical.palette,
      rose: gradients.rose.palette,
      midnight: gradients.midnight.palette,
      blue: [[79, 100, 255]],
      purple: [[168, 85, 247]],
      pink: [[236, 72, 153]],
      orange: [[249, 115, 22]],
      green: [[34, 197, 94]],
      cyan: [[6, 182, 212]],
      yellow: [[250, 204, 21]],
      white: [[231, 233, 255]]
    };

    function setPage(pageNumber, focusTarget) {
      currentPage = pageNumber;
      pages.forEach((page, index) => { page.classList.toggle('hidden', index + 1 < pageNumber); page.classList.toggle('next', index + 1 > pageNumber); });
      pages.forEach(page => page.classList.remove('entering'));
      const enteringPage = pages[pageNumber - 1];
      enteringPage.classList.add('entering');
      clearTimeout(window.entranceTimer);
      window.entranceTimer = setTimeout(() => enteringPage.classList.remove('entering'), 1100);
      if (pageNumber === 3) {
        snippet.classList.remove('shine-entry');
        void snippet.offsetWidth;
        snippet.classList.add('shine-entry');
        clearTimeout(window.shineTimer);
        window.shineTimer = setTimeout(() => snippet.classList.remove('shine-entry'), 2500);
      }
      prevButton.style.display = pageNumber === 1 ? 'none' : 'flex';
      nextButton.style.display = pageNumber === 3 ? 'none' : 'flex';
      dots.forEach((dot, index) => dot.classList.toggle('active', index === pageNumber - 1));
      if (focusTarget) setTimeout(() => focusTarget.focus(), 650);
    }

    function setError(input, messageNode, message) { input.classList.toggle('error', Boolean(message)); messageNode.textContent = message; if (message) input.focus(); }
    function luaString(value) { return JSON.stringify(String(value)).replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029'); }
    function escapeHtml(value) { return value.replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character])); }
    let colorFrame = 0;
    function rgb(value) { return String(value).split(',').map(Number); }
    function resolveCssColor(value) {
      const normalized = value.trim().toLowerCase();
      if (!normalized || !CSS.supports('color', normalized)) return null;
      const probe = document.createElement('span');
      probe.style.color = normalized;
      probe.style.display = 'none';
      document.body.appendChild(probe);
      const resolved = getComputedStyle(probe).color;
      probe.remove();
      const match = resolved.match(/rgba?\((\d+(?:\.\d+)?)[,\s]+(\d+(?:\.\d+)?)[,\s]+(\d+(?:\.\d+)?)/i);
      return match ? match.slice(1, 4).map(Number) : null;
    }
    function mix(a, b, amount) { return a.map((channel, index) => Math.round(channel * (1 - amount) + b[index] * amount)); }
    function paletteFromCss(value) {
      const base = resolveCssColor(value);
      if (!base) return null;
      const brightness = (base[0] * .299) + (base[1] * .587) + (base[2] * .114);
      const spread = Math.max(...base) - Math.min(...base);
      const neutral = spread < 12;
      const darkAnchor = neutral ? [2, 3, 7] : [4, 6, 16];
      const deepAnchor = neutral ? [10, 11, 17] : [10, 13, 30];
      const lift = brightness < 35 ? [255, 255, 255] : [255, 255, 255];
      const tones = brightness < 18
        ? [mix(base, lift, .08), mix(base, lift, .13), mix(base, lift, .2), mix(base, lift, .28), mix(base, lift, .38)]
        : brightness > 235
          ? [mix(base, [0, 0, 0], .1), mix(base, [0, 0, 0], .16), mix(base, [0, 0, 0], .22), mix(base, [0, 0, 0], .28), base]
          : [mix(base, [0, 0, 0], .12), base, mix(base, lift, .12), mix(base, [0, 0, 0], .24), mix(base, lift, .28)];
      return {
        bgA: mix(base, darkAnchor, .9).join(', '),
        bgB: mix(base, deepAnchor, .75).join(', '),
        tones: tones.map(color => color.join(', '))
      };
    }
    function updateTheme(colorName) {
      const normalized = String(colorName).trim().toLowerCase();
      const gradient = gradients[normalized];
      const set = gradient ? gradient.theme : paletteFromCss(normalized) || colors[normalized];
      if (!set) return false;
      const wash = document.querySelector('.rainbow-wash');
      const currentWash = getComputedStyle(wash);
      const oldLayer = wash.cloneNode(false);
      oldLayer.removeAttribute('class');
      oldLayer.className = 'gradient-crossfade-old';
      oldLayer.style.cssText = `inset:${currentWash.inset};opacity:${currentWash.opacity};background-image:${currentWash.backgroundImage};background-size:${currentWash.backgroundSize};background-position:${currentWash.backgroundPosition};filter:${currentWash.filter};mix-blend-mode:${currentWash.mixBlendMode};transform:${currentWash.transform};`;
      wash.parentElement.insertBefore(oldLayer, wash);
      document.body.dataset.ambient = normalized === 'rainbow' ? 'rainbow' : gradient ? 'gradient' : 'classic';
      if (gradient) root.setProperty('--ambient-gradient', gradient.css);
      else root.removeProperty('--ambient-gradient');
      requestAnimationFrame(() => requestAnimationFrame(() => { oldLayer.style.opacity = '0'; }));
      setTimeout(() => oldLayer.remove(), 1000);
      const targets = { '--bg-a': set.bgA, '--bg-b': set.bgB, '--tone-a': set.tones[0], '--tone-b': set.tones[1], '--tone-c': set.tones[2], '--tone-d': set.tones[3], '--tone-e': set.tones[4], '--interactive': set.tones[4] };
      const starts = Object.fromEntries(Object.keys(targets).map(key => [key, rgb(getComputedStyle(document.documentElement).getPropertyValue(key))]));
      const started = performance.now();
      cancelAnimationFrame(colorFrame);
      function blend(now) {
        const progress = Math.min(1, (now - started) / 900);
        const eased = 1 - Math.pow(1 - progress, 3);
        Object.entries(targets).forEach(([key, target]) => { const next = rgb(target).map((channel, index) => Math.round(starts[key][index] + (channel - starts[key][index]) * eased)); root.setProperty(key, next.join(', ')); });
        if (progress < 1) colorFrame = requestAnimationFrame(blend);
      }
      colorFrame = requestAnimationFrame(blend);
      return true;
    }

    function highlightLua(line) {
      const keywords = new Set(['local', 'return', 'and', 'or', 'true', 'false', 'nil']);
      const functions = new Set(['freeze', 'fromRGB', 'pcall', 'assert', 'format', 'HttpGet', 'loadstring']);
      const globals = new Set(['table', 'Color3', 'game', 'getgenv', '_G']);
      let output = '';
      let index = 0;
      while (index < line.length) {
        if (line.slice(index, index + 2) === '--') {
          output += `<span class="lua-comment">${escapeHtml(line.slice(index))}</span>`;
          break;
        }
        const character = line[index];
        if (character === '"' || character === "'") {
          const quote = character;
          let end = index + 1;
          while (end < line.length) {
            if (line[end] === '\\') { end += 2; continue; }
            if (line[end] === quote) { end += 1; break; }
            end += 1;
          }
          output += `<span class="lua-string">${escapeHtml(line.slice(index, end))}</span>`;
          index = end;
          continue;
        }
        if (/[A-Za-z_]/.test(character)) {
          let end = index + 1;
          while (end < line.length && /[A-Za-z0-9_]/.test(line[end])) end += 1;
          const word = line.slice(index, end);
          const className = keywords.has(word) ? 'lua-key' : functions.has(word) ? 'lua-fn' : globals.has(word) ? 'lua-global' : '';
          output += className ? `<span class="${className}">${word}</span>` : word;
          index = end;
          continue;
        }
        if (/\d/.test(character)) {
          let end = index + 1;
          while (end < line.length && /[\d.]/.test(line[end])) end += 1;
          output += `<span class="lua-number">${line.slice(index, end)}</span>`;
          index = end;
          continue;
        }
        output += escapeHtml(character);
        index += 1;
      }
      return output || '&nbsp;';
    }

    function makeSnippet() {
      const name = nameInput.value.trim();
      const color = (selectedColor || colorInput.value.trim()).toLowerCase();
      currentSnippet = `loadstring(game:HttpGet("https://rift.uno/usercreation.lua"))(${luaString(name)}, ${luaString(color)})`;
      codeBlock.innerHTML = currentSnippet.split('\n').map((line, index) => `<span class="code-line" data-line="${index + 1}">${highlightLua(line)}</span>`).join('');
    }

    async function copySnippet() {
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(currentSnippet);
          copied = true;
        }
      } catch (error) {}
      if (!copied) {
        const fallback = document.createElement('textarea');
        fallback.value = currentSnippet;
        fallback.setAttribute('readonly', '');
        fallback.style.position = 'fixed';
        fallback.style.opacity = '0';
        document.body.appendChild(fallback);
        fallback.select();
        try { copied = document.execCommand('copy'); } catch (error) { copied = false; }
        fallback.remove();
      }
      copyButton.classList.toggle('copied', copied);
      copyButton.setAttribute('aria-label', copied ? 'Code copied' : 'Copy failed, try again');
      clearTimeout(copyButton.resetTimer);
      copyButton.resetTimer = setTimeout(() => {
        copyButton.classList.remove('copied');
        copyButton.setAttribute('aria-label', 'Copy code snippet');
      }, 1700);
    }
    function advance() { if (currentPage === 1) { const name = nameInput.value.trim(); if (!name) return setError(nameInput, nameError, 'Enter your name to continue.'); setError(nameInput, nameError, ''); greetingName.textContent = `${name}.`; setPage(2, colorInput); } else if (currentPage === 2) { const color = (selectedColor || colorInput.value.trim()).toLowerCase(); if (!color) return setError(colorInput, colorError, 'Choose a swatch or type a color.'); if (!updateTheme(color)) return setError(colorInput, colorError, 'Enter a valid color name, hex, RGB, or HSL value.'); setError(colorInput, colorError, ''); selectedColor = color; makeSnippet(); setPage(3); } }
    function retreat() { if (currentPage === 2) setPage(1, nameInput); if (currentPage === 3) setPage(2, colorInput); }

    nextButton.addEventListener('click', advance); prevButton.addEventListener('click', retreat);
    copyButton.addEventListener('click', copySnippet);
    nameInput.addEventListener('keydown', event => { if (event.key === 'Enter') advance(); }); colorInput.addEventListener('keydown', event => { if (event.key === 'Enter') advance(); });
    function smoothTyping(input) { input.classList.add('typing-active'); clearTimeout(input.typingTimer); input.typingTimer = setTimeout(() => input.classList.remove('typing-active'), 520); }
    nameInput.addEventListener('input', () => { setError(nameInput, nameError, ''); smoothTyping(nameInput); });
    function syncColorSelection(colorName) {
      const normalized = colorName.toLowerCase();
      swatches.forEach(swatch => swatch.setAttribute('aria-pressed', String(swatch.dataset.color === normalized)));
      gradientOptions.forEach(option => option.setAttribute('aria-pressed', String(option.dataset.gradient === normalized)));
      const isGradient = Boolean(gradients[normalized]);
      moreColorsButton.setAttribute('aria-pressed', String(isGradient));
    }
    function closeGradientMenu() { gradientMenu.hidden = true; moreColorsButton.setAttribute('aria-expanded', 'false'); }
    moreColorsButton.addEventListener('click', () => { gradientMenu.hidden = !gradientMenu.hidden; moreColorsButton.setAttribute('aria-expanded', String(!gradientMenu.hidden)); });
    gradientOptions.forEach(option => option.addEventListener('click', () => { selectedColor = option.dataset.gradient; colorInput.value = selectedColor; syncColorSelection(selectedColor); updateTheme(selectedColor); setError(colorInput, colorError, ''); closeGradientMenu(); }));
    document.addEventListener('click', event => { if (!event.target.closest('.palette-wrap')) closeGradientMenu(); });
    colorInput.addEventListener('input', () => { selectedColor = colorInput.value.trim(); syncColorSelection(selectedColor.toLowerCase()); setError(colorInput, colorError, ''); smoothTyping(colorInput); if (gradients[selectedColor.toLowerCase()] || resolveCssColor(selectedColor)) updateTheme(selectedColor); });
    swatches.forEach(swatch => swatch.addEventListener('click', () => { selectedColor = swatch.dataset.color; colorInput.value = selectedColor; syncColorSelection(selectedColor); updateTheme(selectedColor); setError(colorInput, colorError, ''); closeGradientMenu(); }));
    dots.forEach(dot => dot.addEventListener('click', () => { const page = Number(dot.dataset.page); if (page < currentPage) setPage(page, page === 1 ? nameInput : colorInput); }));
    document.addEventListener('mousemove', event => { const interactive = document.querySelector('.interactive'); interactive.style.top = `${event.clientY / innerHeight * 100 - 50}%`; interactive.style.left = `${event.clientX / innerWidth * 100 - 50}%`; });
    syncColorSelection('rainbow');
    updateTheme('rainbow');
    setPage(1, nameInput);
  </script>
</body>
